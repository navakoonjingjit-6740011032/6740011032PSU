<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>แบบฟอร์มลงทะเบียนผู้ใช้</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 1rem;
        line-height: 1.6;
        background: #f5f7fa;
      }
      main {
        max-width: 700px;
        margin: auto;
        background: #ffffff;
        padding: 1.5rem;
        border-radius: 8px;
      }
      fieldset {
        margin-bottom: 1.5rem;
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      legend {
        font-weight: bold;
      }
      label {
        display: block;
        margin-top: 0.75rem;
      }
      input,
      textarea,
      select,
      button {
        width: 100%;
        max-width: 100%;
        padding: 0.5rem;
        margin-top: 0.25rem;
        box-sizing: border-box;
      }
      small {
        color: #555;
      }
      .buttons {
        display: flex;
        gap: 1rem;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <h1 id="form-title">แบบฟอร์มลงทะเบียน</h1>

      <form aria-labelledby="form-title">
        <fieldset itemscope itemtype="https://schema.org/Person">
          <legend>ข้อมูลส่วนตัว</legend>

          <label for="fullname">ชื่อ-นามสกุล</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            required
            minlength="3"
            aria-required="true"
            aria-describedby="name-help"
            itemprop="name"
          />
          <small id="name-help">กรุณากรอกอย่างน้อย 3 ตัวอักษร</small>

          <label for="email">อีเมล</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            aria-required="true"
            itemprop="email"
          />

          <label for="phone">เบอร์โทรศัพท์</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[0-9]{9,10}"
            inputmode="numeric"
            aria-describedby="phone-help"
            itemprop="telephone"
          />
          <small id="phone-help">กรอกตัวเลข 9–10 หลัก</small>

          <label for="birthdate">วันเกิด</label>
          <input
            type="date"
            id="birthdate"
            name="birthdate"
            itemprop="birthDate"
          />
        </fieldset>

        <fieldset itemscope itemtype="https://schema.org/PostalAddress">
          <legend>ที่อยู่</legend>

          <label for="address">ที่อยู่</label>
          <textarea
            id="address"
            name="address"
            required
            aria-required="true"
            itemprop="streetAddress"
          ></textarea>

          <label for="city">จังหวัด</label>
          <input
            type="text"
            id="city"
            name="city"
            required
            aria-required="true"
            itemprop="addressRegion"
          />

          <label for="postal">รหัสไปรษณีย์</label>
          <input
            type="text"
            id="postal"
            name="postal"
            pattern="[0-9]{5}"
            inputmode="numeric"
            required
            aria-required="true"
            itemprop="postalCode"
          />
        </fieldset>

        <fieldset>
          <legend>ข้อมูลการชำระเงิน</legend>

          <label for="cardtype">ประเภทบัตร</label>
          <select id="cardtype" name="cardtype" required aria-required="true">
            <option value="">-- เลือก --</option>
            <option value="visa">Visa</option>
            <option value="mastercard">MasterCard</option>
          </select>

          <label for="cardnumber">หมายเลขบัตร</label>
          <input
            type="password"
            id="cardnumber"
            name="cardnumber"
            pattern="[0-9]{16}"
            inputmode="numeric"
            required
            aria-required="true"
            aria-describedby="card-help"
          />
          <small id="card-help">กรอกตัวเลข 16 หลัก</small>

          <label for="amount">จำนวนเงิน (บาท)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="1"
            max="100000"
            required
            aria-required="true"
          />
        </fieldset>

        <div class="buttons">
          <button type="submit">ส่งข้อมูล</button>
          <button type="reset">ล้างฟอร์ม</button>
        </div>
      </form>
    </main>
    <a
      href="../Firm.html"
      style="
        display: inline-block;
        padding: 10px 20px;
        margin: 5px;
        background-color: #607d8b;
        color: white;
        border-radius: 8px;
      "
    >
      ⬅ กลับ
    </a>

    <!-- ปุ่มโจทย์ผลลัพธ์ -->
    <a
      href="../โจทย์ผลลัพธ์/Tasks06.html"
      style="
        display: inline-block;
        padding: 10px 20px;
        margin: 5px;
        background-color: #4caf50;
        color: white;
        border-radius: 8px;
      "
    >
      ดูโจทย์ผลลัพธ์
    </a>
  </body>
</html>
